    <circle cx="70" cy="30" r="6" fill="#28c840"/>
    
  <text x="280.0" y="30" text-anchor="middle" class="title" opacity="0.9" filter="url(#glow)">RANJIT-AI ANALYSIS ENGINE v4.2</text>
