  <rect x="26" y="270" width="9" height="16" fill="#ffb400" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1s" begin="6.34s" repeatCount="indefinite"/>
  </rect>
