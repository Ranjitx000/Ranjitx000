<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb400" />
      <stop offset="50%" stop-color="#39e6ff" />
      <stop offset="100%" stop-color="#ffb400" />
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
    text { font-family: 'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace; }
    .line { font-size: 14px; white-space: pre; }
    .title { fill: #ffb400; font-size: 14px; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="560" height="360" rx="10" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="559" height="359" rx="10" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="0" y="0" width="560" height="46" rx="10" fill="#141110" opacity="0.6"/>
  <rect x="0" y="36" width="560" height="10" fill="#141110" opacity="0.6"/>
  
    <circle cx="30" cy="30" r="6" fill="#ff5f57"/>
